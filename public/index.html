<!DOCTYPE html>
<html lang="en-GB" style="overscroll-behavior: none">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="mini-tokyo-3d.min.css" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <title>Mini London 3D</title>
    <meta
      name="description"
      content="A real-time 3D digital map of London's public transport system."
    />
    <meta
      name="viewport"
      content="user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, width=device-width, height=device-height, initial-scale=1"
    />
    <meta property="og:title" content="Mini London 3D" />
    <meta
      property="og:description"
      content="A real-time 3D digital map of London's public transport system."
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:site_name" content="Mini London 3D" />
    <script src="mini-tokyo-3d.min.js"></script>
    <script src="config.local.js"></script>
    <!-- <script src="mt3d-plugin-precipitation.min.js"></script>
    <script src="mt3d-plugin-fireworks.min.js"></script>
    <script src="mt3d-plugin-livecam.min.js"></script>
    <script src="mt3d-plugin-plateau.min.js"></script>
    <script src="mt3d-plugin-gtfs.min.js"></script> -->
  </head>
  <body
    style="width: 100%; height: 100%; margin: 0; padding: 0; position: absolute"
  >
    <div id="map" style="width: 100%; height: 100%"></div>
    <script>
      const matchLang = location.search.match(/lang=(.*?)(?:&|$)/),
        matchSelection = location.search.match(/selection=(.*?)(?:&|$)/),
        matchGtfsUrl = location.search.match(/gtfsurl=(.*?)(?:&|$)/),
        matchVehiclePositionUrl = location.search.match(
          /gtfsvpurl=(.*?)(?:&|$)/
        ),
        matchGtfsColor = location.search.match(/gtfscolor=(.*?)(?:&|$)/),
        matchHash = location.hash.match(
          /[^\d\.\-]*([\d\.\-]*)\/?([\d\.\-]*)\/?([\d\.\-]*)\/?([\d\.\-]*)\/?([\d\.\-]*)/
        ),
        // added matchcity to extract city parameter from URL
        matchCity = location.search.match(/city=(.*?)(?:&|$)/),
        options = {
          container: "map",
          plugins: [
            // mt3dPrecipitation(),
            // mt3dFireworks(),
            // mt3dLivecam(),
            // mt3dPlateau({ enabled: false }),
            // mt3dGtfs({ enabled: false }),
          ],
        };
      const cfg = window.MT3D_CONFIG || {};
      if (cfg.accessToken) options.accessToken = cfg.accessToken;
      if (cfg.secrets) {
        options.secrets = cfg.secrets;
      } else if (cfg.tflAppKey || cfg.tflKey || cfg.tfl_key) {
        options.secrets = {
          tflAppKey: cfg.tflAppKey || cfg.tflKey || cfg.tfl_key,
        };
      }

      if (matchLang) {
        options.lang = decodeURIComponent(matchLang[1]);
      }
      if (matchSelection) {
        options.selection = decodeURIComponent(matchSelection[1]);
      }
      if (matchHash[1]) {
        options.zoom = +matchHash[1];
      }
      if (matchHash[2] && matchHash[3]) {
        options.center = [+matchHash[3], +matchHash[2]];
      }
      if (matchHash[4]) {
        options.bearing = +matchHash[4];
      }
      if (matchHash[5]) {
        options.pitch = +matchHash[5];
      }
      if (matchGtfsUrl && matchGtfsColor) {
        options.dataSources = [
          {
            gtfsUrl: decodeURIComponent(matchGtfsUrl[1]),
            vehiclePositionUrl: matchVehiclePositionUrl
              ? decodeURIComponent(matchVehiclePositionUrl[1])
              : undefined,
            color: `#${decodeURIComponent(matchGtfsColor[1])}`,
          },
        ];
      }
      // City preset (only applies if hash doesn't already specify a view)
      const city = matchCity
        ? decodeURIComponent(matchCity[1]).toLowerCase()
        : cfg.city
          ? String(cfg.city).toLowerCase()
          : "london";

      if (!matchCity && city) {
        const url = new URL(location.href);
        url.searchParams.set("city", city);
        history.replaceState(null, "", `${url.pathname}${url.search}${url.hash}`);
      }

      if (!options.lang && city === "london") {
        options.lang = "en";
      }

      document.documentElement.lang =
        options.lang === "ja" ? "ja-JP" : "en-GB";

      const hasHashView =
        matchHash &&
        (matchHash[1] ||
          (matchHash[2] && matchHash[3]) ||
          matchHash[4] ||
          matchHash[5]);

      if (!hasHashView && city === "london") {
        options.center = [-0.1276, 51.5074]; // [lng, lat]
        options.zoom = 11.5;
        options.bearing = 0;
        options.pitch = 45;
      }

      const map = new mt3d.Map(options);
    </script>
  </body>
</html>
